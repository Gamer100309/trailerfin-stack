services:

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin:/config
      - ${MEDIA_PATH}:/mnt/media
    ports:
      - 8096:8096
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_PATH}/${TV_FOLDER_NAME}:/tv
      - ${MEDIA_PATH}/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_PATH}/${MOVIE_FOLDER_NAME}:/movies
      - ${MEDIA_PATH}/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ./config/lidarr:/config
      - ${MEDIA_PATH}/${MUSIC_FOLDER_NAME}:/music
      - ${MEDIA_PATH}/downloads:/downloads
    ports:
      - 8686:8686
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    depends_on:
      - jellyfin

  # --- qBittorrent ist standardmäßig deaktiviert ---
  # Ohne VPN ist deine IP für andere Torrent-Peers sichtbar. Aktiviere diesen
  # Service erst, wenn ein VPN (z.B. via Gluetun-Container) vorgeschaltet ist.
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   container_name: qbittorrent
  #   environment:
  #     - PUID=0
  #     - PGID=0
  #     - TZ=${TZ}
  #     - WEBUI_PORT=8080
  #   volumes:
  #     - ./config/qbittorrent:/config
  #     - ${MEDIA_PATH}/downloads:/downloads
  #   ports:
  #     - 8080:8080
  #     - 6881:6881
  #     - 6881:6881/udp
  #   restart: unless-stopped

  ytdlp2strm:
    build: ./ytdlp2strm
    container_name: ytdlp2strm
    environment:
      - TZ=${TZ}
    volumes:
      - ./ytdlp2strm-configs/config.json:/opt/ytdlp2STRM/config/config.json
      - ./ytdlp2strm-configs/youtube-config.json:/opt/ytdlp2STRM/plugins/youtube/config.json
      - ./ytdlp2strm-configs/cookies.txt:/cookies/cookies.txt:ro
    ports:
      - 5000:5000
    restart: unless-stopped

  trailerfin:
    build: ./trailerfin_rust
    container_name: trailerfin
    environment:
      - TRAILERFIN_DATA_SOURCE=tmdb
      - TRAILERFIN_TMDB_API_KEY=${TMDB_API_KEY}
      - TRAILERFIN_SCAN_PATH=/data
      - TRAILERFIN_MOVIE_FOLDERS=${MOVIE_FOLDER_NAME}
      - TRAILERFIN_TV_FOLDERS=${TV_FOLDER_NAME}
      - TRAILERFIN_THREADS=4
      - TRAILERFIN_SHOULD_SCHEDULE=true
      - TRAILERFIN_SCHEDULE=${TRAILERFIN_SCHEDULE}
      - TRAILERFIN_VIDEO_FILENAME=trailer.strm
      - TRAILERFIN_YTDLP_PROXY_URL=http://ytdlp2strm:5000
      - TRAILERFIN_PREFERRED_LANGUAGE=${TRAILERFIN_PREFERRED_LANGUAGE}
      - TRAILERFIN_MODE=${TRAILERFIN_MODE}
      - TRAILERFIN_CHANNEL_WHITELIST=${TRAILERFIN_CHANNEL_WHITELIST}
      - TRAILERFIN_CHANNEL_BLACKLIST=${TRAILERFIN_CHANNEL_BLACKLIST}
      - TRAILERFIN_DOWNLOAD_COOKIES_FILE=/cookies/cookies.txt
    volumes:
      - ${MEDIA_PATH}:/data
      - ./config/trailerfin:/config
      - ./ytdlp2strm-configs/cookies.txt:/cookies/cookies.txt:ro
    restart: unless-stopped
    depends_on:
      - ytdlp2strm
